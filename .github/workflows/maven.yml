
      - name: Publish Test Execution Summary
        if: always()
        run: |
          python - <<'PY'
          import glob
          import os
          import re
          import xml.etree.ElementTree as ET

          files = glob.glob("target/surefire-reports/TEST-*.xml")
          total = passed = failed = skipped = 0
          response_times = []

          for file in files:
              try:
                  root = ET.parse(file).getroot()
                  if root.tag != "testsuite":
                      continue
                  tests = int(root.get("tests", 0))
                  errors = int(root.get("errors", 0))
                  failures = int(root.get("failures", 0))
                  skips = int(root.get("skipped", 0))
                  total += tests
                  failed += errors + failures
                  skipped += skips
                  passed += max(0, tests - errors - failures - skips)

                  text = " ".join(
                      node.text or "" for node in root.iter()
                  )
                  response_times.extend(
                      re.findall(r"Response Time:\s*(\d+)\s*ms", text)
                  )
              except (ET.ParseError, OSError, ValueError):
                  continue

          lines = [
              "# TestForge — Execution Summary",
              "",
              "| Metric | Result |",
              "|---|---:|",
              f"| Total tests | {total} |",
              f"| Passed | {passed} |",
              f"| Failed | {failed} |",
              f"| Skipped | {skipped} |",
              "",
          ]

          if response_times:
              values = [int(value) for value in response_times]
              lines += [
                  "## API Response Times",
                  "",
                  f"- Samples recorded: {len(values)}",
                  f"- Average: {sum(values) / len(values):.0f} ms",
                  f"- Fastest: {min(values)} ms",
                  f"- Slowest: {max(values)} ms",
                  "",
              ]
          else:
              lines += [
                  "_No API response-time measurements found in the test reports._",
                  "",
              ]

          if not files:
              lines += [
                  "_No Surefire XML reports were found for this run._",
                  "",
              ]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
