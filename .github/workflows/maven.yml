
  # API Performance Test Suite
  api-performance-test:
    name: API Performance Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run API Performance Tests
        run: mvn -B clean test -Papi-performance

      - name: Upload API Performance Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-api-performance
          path: test-output/ExtentReport.html
